name: ci-lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read # registry cache and the pinned tools image

jobs:
  # UI app (src/): one environment for lint, format, type check and tests.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Caches uv's package downloads (keyed on uv.lock), not the venv: a cached venv points at
      # a Python that the next runner does not have, so uv deletes it and starts over.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Sync venv
        run: uv sync --dev --locked --extra observability --extra ui

      # --no-sync: keep the venv exactly as synced above (with the ui and observability extras).
      - name: lint
        run: uv run --no-sync ruff check --exit-non-zero-on-fix --no-cache --output-format github src/ server/src/

      - name: format
        run: uv run --no-sync ruff format --check --no-cache --output-format github src/ server/src/

      - name: type-check
        run: uv run --no-sync ty check --output-format github --error-on-warning src/

      - name: tests
        run: uv run --no-sync --with pytest --with pytest-asyncio python -m pytest -q tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Builds the same RunPod image the Publish Image workflow pushes (docker-bake.hcl, target
  # runpod), without pushing, so a broken Dockerfile, dependency or start script fails the PR
  # instead of the publish after merge. server-test runs the server unit tests inside the
  # server image. Layers come read-only from the registry cache the publish writes.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build the RunPod image and run the server tests
        uses: docker/bake-action@v6
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/soundpilot
          CACHE: ghcr.io/${{ github.repository_owner }}/soundpilot:buildcache
        with:
          source: .
          files: docker-bake.hcl
          targets: runpod,server-test
          # No image output and no cache writes: a PR must not overwrite main's cache.
          set: |
            *.output=type=cacheonly
            *.cache-to=
