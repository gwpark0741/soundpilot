name: ci-lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-format-check:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: venv cache
        id: venv-cache
        uses: actions/cache@v4
        with:
          key: cache-key-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          path: |
            ./.venv

      - name: Sync venv
        if: ${{ steps.venv-cache.outputs.cache-hit != 'true' }}
        run: |
          uv sync --dev --locked --extra observability --extra ui

      - name: lint
        run: |
          uv run ruff check --exit-non-zero-on-fix --no-cache --output-format github src/ server/src/

      - name: format
        run: |
          uv run ruff format --check --no-cache --output-format github src/ server/src/

      - name: type-check
        run: |
          uv run ty check --output-format github --error-on-warning src/

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Backend tests
        run: |
          uv sync --dev --locked --extra observability --extra ui
          uv run --extra ui --with pytest --with pytest-asyncio python -m pytest -q tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Builds the UI and server images without pushing, so a broken Dockerfile or dependency
  # fails the PR instead of the publish after merge.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - uses: docker/setup-buildx-action@v3
      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          # Read-only: layers published by the Publish Image workflow.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/soundpilot:buildcache-ui
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          # Read-only: layers published by the Publish Image workflow.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/soundpilot:buildcache-server
