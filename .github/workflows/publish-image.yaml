name: Publish Image

# Builds the single RunPod image (UI + inference server + Audyssey tools, Dockerfile.runpod)
# and pushes ghcr.io/<owner>/soundpilot:latest and :<commit sha>. The UI and server images are
# built here from this repo as stages and are not pushed; the tools image is a pinned prebuilt
# package because its code lives in the Audyssey repo.
on:
  push:
    branches: [main]
    # Only what the images copy; docs, tests and CI-only changes keep the current image.
    paths:
      - src/**
      - server/**
      - web/**
      - scripts/runpod/**
      - pyproject.toml
      - uv.lock
      - Dockerfile
      - Dockerfile.runpod
      - .dockerignore
      - .github/workflows/publish-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/soundpilot
  # Audyssey tools verified with SoundPilot end to end on 2026-11-23 (sv3). Change only after re-verifying.
  TOOLS_IMAGE: ghcr.io/${{ github.repository_owner }}/soundpilot-tools:demo-1117

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk (stages and the final image need about 30 GB)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Plain `docker build` (default builder) so the final build can use the local stage images.
      - name: Build the UI and server stages
        run: |
          docker build -f Dockerfile -t soundpilot-ui:ci .
          docker build -f server/Dockerfile -t soundpilot-server:ci .
          docker builder prune -af
          df -h /

      - name: Build the single image
        run: |
          docker build -f Dockerfile.runpod \
            --build-arg UI_IMAGE=soundpilot-ui:ci \
            --build-arg SERVER_IMAGE=soundpilot-server:ci \
            --build-arg TOOLS_IMAGE="$TOOLS_IMAGE" \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          df -h /

      - name: Push
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
