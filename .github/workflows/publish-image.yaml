name: Publish Image

# Builds the single RunPod image (UI + inference server + Audyssey tools, Dockerfile.runpod)
# and pushes ghcr.io/<owner>/soundpilot:latest and :<commit sha>. The UI and server images are
# built here from this repo as stages and are not pushed; the tools image is a pinned prebuilt
# package because its code lives in the Audyssey repo. The layer cache lives next to the image
# as ghcr.io/<owner>/soundpilot:buildcache-{ui,server,runpod}.
on:
  push:
    branches: [main]
    # Only what the images copy; docs, tests and CI-only changes keep the current image.
    paths:
      - src/**
      - server/**
      - web/**
      - scripts/runpod/**
      - pyproject.toml
      - uv.lock
      - Dockerfile
      - Dockerfile.runpod
      - docker-bake.hcl
      - .dockerignore
      - .github/workflows/publish-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/soundpilot
  # Audyssey tools verified with SoundPilot end to end on 2026-11-23 (sv3). Change only after re-verifying.
  TOOLS_IMAGE: ghcr.io/${{ github.repository_owner }}/soundpilot-tools:demo-1117

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A full rebuild (lock file change) still needs about 30 GB.
      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # docker-bake.hcl builds the UI and server stages and the single image in one graph and
      # pushes only the single image. Every layer is looked up in the registry cache first, so
      # only what changed is rebuilt and uploaded; unchanged layers (the CUDA venvs) are reused.
      - name: Build and push the single image
        uses: docker/bake-action@v6
        env: # bake variables; IMAGE and TOOLS_IMAGE come from the workflow env
          TAG: ${{ github.sha }}
          REVISION: ${{ github.sha }}
          CACHE: ${{ env.IMAGE }}:buildcache
        with:
          source: .
          files: docker-bake.hcl
          targets: runpod
          set: runpod.output=type=registry

      - name: Tag latest
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:${{ github.sha }}"
